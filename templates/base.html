<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLeveliPy{% block title %}{% endblock %}</title>
</head>
<body>
    <nav>
    <a href="/">Home</a>
    <a href="/fetch-file">Download File</a>
    <a href="/past-paper-checker">Past Paper Checker</a>
    {% if session.userId %}
    <a href="/grading-history">Grading History</a>
    <a href="/coach-chat">Chat With Coach</a>
    <a href="/weak-topics">Weak Topics</a>
    <a href="/flashcards">Flash Cards</a>
    <a href="/practice-questions">Practice Questions</a>
    <span>{{ session.userEmail }}</span>
    <form action="/logout" method="POST" style="display: inline;">
        <button type="submit">Log Out</button>
    </form>
    {% else %}
    <a href="/login">Log In</a>
    <a href="/signup">Sign Up</a>
    {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
