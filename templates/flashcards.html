{% extends "base.html" %}
{% block title %} - Flashcards{% endblock %}

{% block content %}

<h1>Flashcards Review</h1>

{% if error %}
<p class="errorText">{{ error }}</p>
{% endif %}

<div id="flashCardArea">
    <p id="noCardsMsg" class="hidden">No cards due for review right now. Come back later or grade a question to generate more.</p>

    <div id="cardDisplay" class="hidden">
        <p id="cardCount" class="cardCounter"></p>
        <div class="flashcardBox">
            <p id="cardFront" class="flashcardFront"></p>
            <p id="cardBack" class="flashcardBack hidden"></p>
        </div>

        <button id="showAnswerBtn">Show Answer</button>

        <div id="ratingBtns" class="ratingRow hidden">
            <button data-quality="1">Again</button>
            <button data-quality="3">Hard</button>
            <button data-quality="4">Good</button>
            <button data-quality="5">Easy</button>
        </div>
    </div>
</div>

<script>
    window.dueCards = {{ cards | tojson }};
</script>

<script src="{{ url_for('static', filename='js/flashcards.js') }}"></script>
{% endblock %}
