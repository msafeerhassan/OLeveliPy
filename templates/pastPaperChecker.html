{% extends "base.html" %}
{% block title %} - Past Paper Checker {% endblock %}

{% block content %}

<h1>Get Solved Past Papers Checked by AI</h1>

{% if error %}
<p class="errorText">{{ error }}</p>
{% endif %}

<form action="/past-paper-checker/submit" method="POST" enctype="multipart/form-data" id="pastPaperExaminerForm">

    <div class="fieldGroup">
        <label for="subjectName">Subject Name:</label>
        <input type="text" name="subjectName" id="subjectName" placeholder="Physics" required>
    </div>

    <div class="fieldGroup">
        <label for="subjectCode">Subject Code:</label>
        <input type="number" name="subjectCode" id="subjectCode" placeholder="5054" required>
    </div>

    <div class="fieldGroup">
        <label for="examinationYear">Examination Year:</label>
        <input type="number" name="examinationYear" id="examinationYear" placeholder="2025" required>
    </div>
    
    <div class="fieldGroup">
        <label for="examinationSeries">Examination Series:</label>
        <select name="examinationSeries" id="examinationSeries">
            <option value="may-june">May/June</option>
            <option value="oct-nov">October/November</option>
        </select>
    </div>

    <div class="fieldGroup">
        <label for="variant">Variant:</label>
        <input type="number" name="variant" value="11" required id="variant">
    </div>
    <div class="fieldGroup">
        <label>Question Scope:</label>
        <div class="radioRow">
            <label for="scopeSpecific"><input type="radio" name="questionScope" value="specific" checked id="scopeSpecific"> Specific Question</label>
            <label for="scopeAll"><input type="radio" name="questionScope" value="all" id="scopeAll"> All Questions</label>
        </div>
    </div>

    <div class="fieldGroup">
        <label for="questionNumber">Question Number (only required for specific question)</label>
        <input type="text" name="questionNumber" placeholder="e.g. 4 or 4(b)(ii)" id="questionNumber">
    </div>

    <div class="fieldGroup">
        <label for="answerImages">Upload Answer Images</label>
        <input type="file" name="answerImages" accept="image/*" multiple required id="answerImages">
    </div>

    <button type="submit">Examine and Mark!</button>
</form>


<div class="resultArea">
    <p id="progressStatus"></p>
    <div id="allQuestionsResults"></div>
</div>

<script src="{{ url_for('static', filename='js/gradeAllQuestions.js') }}"></script>
{% endblock %}
